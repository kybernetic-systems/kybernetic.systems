name: CI

# Manual only. Nothing in this repository runs without someone asking for it, so a run always
# corresponds to a person deciding the commit is worth checking.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # Pinned exactly: the `v1` tag no longer receives updates. `vp migrate` moves this forward.
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "26"
          cache: true

      - run: vp install

      # Story tests run in a real browser, which the runner does not have.
      - run: vp exec playwright install --with-deps chromium

      - run: vp check
      - run: vp test --run

      # Build and split, so a broken prerender or host split fails here rather than at deploy.
      - run: vp build
      - run: vp run hosts
