name: CI

# Pull requests only, so merging into main can be gated on these checks: a required status check
# clears when a run reports against the pull request's own commit. Nothing here reads a secret —
# the Cloudflare credentials belong to the production environment, which only the deploy workflow
# names — so running on every pull request grants nothing. Publishing stays a manual dispatch.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # Pinned exactly: the `v1` tag no longer receives updates. `vp migrate` moves this forward.
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "26"
          cache: true

      - run: vp install

      # Story tests run in a real browser, which the runner does not have.
      - run: vp exec playwright install --with-deps chromium

      - run: vp check
      - run: vp test --run

      # Build and split, so a broken prerender or host split fails here rather than at deploy.
      - run: vp build
      - run: vp run hosts
