name: CI

# Checks run on every pull request, so merging into main can be gated on them: a required status
# check only clears when a run reports against the pull request's own commit, which a manual run
# does not do. Nothing here reads a secret — the Cloudflare credentials live on the production
# environment, which only the deploy workflow names — so an automatic run holds no credentials.
#
# Dispatch is kept as well, for running the checks against main without opening a pull request.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # Pinned exactly: the `v1` tag no longer receives updates. `vp migrate` moves this forward.
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "26"
          cache: true

      - run: vp install

      # Story tests run in a real browser, which the runner does not have.
      - run: vp exec playwright install --with-deps chromium

      - run: vp check
      - run: vp test --run

      # Build and split, so a broken prerender or host split fails here rather than at deploy.
      - run: vp build
      - run: vp run hosts
