catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  vitest: 5.0.5
  "@vitest/browser-playwright": 5.0.5
  "@vitest/coverage-v8": 5.0.5
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
minimumReleaseAge: 10080
allowBuilds:
  esbuild: true
  # sharp ships prebuilt binaries as optional dependencies; its install script only compiles from
  # source when none match the platform, so it stays off.
  sharp: false
skills:
  dirs:
    - .claude/skills
permissions:
  "@tanstack/devtools-vite":
    skills: true
  "@tanstack/react-start":
    skills: true
  workerd:
    build: true
minimumReleaseAgeExclude:
  - vite-plus
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"
